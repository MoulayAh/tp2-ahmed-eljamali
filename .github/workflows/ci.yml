name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Les tests bloquaient les merges parce qu'ils etaient rouges (overlap, prix week-end) :
      # les bugs sont corriges, les tests reviennent, avec seuils de couverture.
      - run: npm run coverage
